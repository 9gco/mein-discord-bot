name: Deploy auf VM

# Nach jedem Push auf main holt die VM den neuen Stand selbst und startet den
# Bot neu. Der Runner laeuft auf der Oracle-VM, nicht auf GitHub – dadurch
# fallen fuer private Repos keine Actions-Minuten an.
#
# Einrichtung des Runners auf der VM:
#   1) GitHub -> Repo -> Settings -> Actions -> Runners -> New self-hosted runner
#   2) auf der VM den Registrierungsbefehl aus dem Web-UI kopieren und laufen
#      lassen (Label: oracle)
#   3) Runner muss systemctl restart duerfen -> either als root registrieren
#      oder in /etc/sudoers.d/ eintragen:
#         bot ALL=(root) NOPASSWD: /usr/bin/systemctl restart mein-discord-bot

# Manuell ausloesbar, nicht bei jedem Push. Ohne registrierten Runner auf der
# VM bleibt ein Push-Job sonst ewig in der Warteschlange stehen und der
# Actions-Tab fuellt sich mit Runs, die nie etwas tun.
#
# Aktivieren: in der Oracle-VM den self-hosted Runner registrieren (Schritte aus
# deploy/setup-vm.sh) und diesen Workflow dann ueber "Run workflow" starten.
on:
  workflow_dispatch:

# Der Bot darf nie zwei Deployments gleichzeitig bekommen – hintereinander
# reihen, sonst restartet der Runner zweimal gleichzeitig.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    steps:
      # Kein checkout: das Skript liegt bereits auf der VM und holt den neuen
      # Stand selbst per git pull. Ein Checkout wuerde nur eine zweite Kopie
      # des Repos anlegen.
      - name: Deploy ausfuehren
        run: sudo /opt/mein-discord-bot/deploy/deploy.sh
